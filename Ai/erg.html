<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Sahifasi</title>
  <link rel="stylesheet" href="./wf.css">
</head>
<body>

  <!-- Asosiy oq oyna -->
  <div class="login-card">
    
    <!-- Chap tomon: Forma qismi -->
    <div class="left-side">
      <div class="logo">Your logo</div>
      <h1>Login</h1>
      
      <form>
        <div class="input-group">
          <label>Email</label>
          <input type="email" placeholder="username@gmail.com">
        </div>
        
        <div class="input-group">
          <label>Password</label>
          <input type="password" placeholder="Password">
        </div>
        
        <a href="#" class="forgot">Forgot Password?</a>
        
        <button type="submit" class="sign-in-btn">Sign in</button>
      </form>
      
      <div class="separator">or continue with</div>
      
      <!-- Ijtimoiy tarmoqlar tugmalari -->
      <div class="social-buttons">
        <button class="social-btn">G</button>
        <button class="social-btn">🐱</button>
        <button class="social-btn">F</button>
      </div>
      
      <p class="register-text">Don't have an account yet? <a href="#">Register for free</a></p>
    </div>
    
    <!-- O'ng tomon: Rasm qismi -->
    <div class="right-side">
      <!-- Rasm o'rniga namuna rasm, o'zingiznikini qo'yishingiz mumkin -->
      <img src="https://unsplash.com" alt="Scooter boy">
    </div>

  </div>

</body>
</html>
